{% extends "base.html" %}
{% load static %}
{% block content %}
<!-- Main Content -->
<div class="container-fluid">
    <div class="main-grid">
        <div class="blogs-container">
            {% if blogs.image %}
                <div class="article-image">
                    <img src="{{ blogs.image.url }}" alt="{{ blogs.title }}">
                </div>
            {% endif %}

            <div class="article-meta">
                <div class="meta-info">
                    <div class="meta-item">
                        <i class="fas fa-calendar"></i>
                        {{ blogs.created_at|date:"F d, Y" }}
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-clock"></i>
                        {{ blogs.created_at|time:"H:i" }}
                    </div>
                </div>
            </div>

            <h1 class="article-title">{{ blogs.title }}</h1>

            <div class="blogs-content">
                <p>{{ blogs.Summary|linebreaksbr }}</p>
                {{ blogs.content|safe }}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
